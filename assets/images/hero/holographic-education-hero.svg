    <path d="M34 65c-10-28 28-43 44-21 24-5 32 28 9 36H33c-17 0-20-25 1-29z" fill="none" stroke="#76efff" stroke-width="3"/>
  </g>
  <g transform="translate(710 610)" filter="url(#softGlow)">
    <path d="M50 8l48 17v39c0 35-23 56-48 67C25 120 2 99 2 64V25z" fill="url(#glass)" stroke="#75efff" stroke-width="3"/>
    <path d="M29 64l14 14 28-31" fill="none" stroke="#d4fbff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g fill="#a1f8ff" opacity=".85" filter="url(#softGlow)">
    <circle cx="585" cy="165" r="3"/><circle cx="610" cy="710" r="4"/><circle cx="790" cy="760" r="3"/><circle cx="1490" cy="390" r="4"/><circle cx="1330" cy="105" r="3"/><circle cx="1540" cy="690" r="2"/><circle cx="980" cy="95" r="2"/>
  </g>
  <g stroke="url(#cyanLine)" stroke-width="2" opacity=".8">
    <path d="M760 625L825 585"/><path d="M785 240L865 270"/><path d="M1410 260L1510 250"/><path d="M1210 620L1335 710"/>
  </g>
  <g fill="none" stroke="#62ddff" stroke-opacity=".32">
    <path d="M1050 780c160-45 300-30 450 28" stroke-width="2"/><path d="M930 810c210-34 415-8 600 55" stroke-width="1"/>
  </g>
</svg>
