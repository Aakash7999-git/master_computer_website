    <rect x="18" y="18" width="609" height="350" rx="13" fill="url(#screen)" stroke="#65dbff" stroke-opacity=".35"/>
    <path d="M38 70h570M38 325h570" stroke="#65dbff" stroke-opacity=".22"/>
    <circle cx="48" cy="45" r="5" fill="#6df5ff"/><circle cx="67" cy="45" r="5" fill="#8b74ff"/><circle cx="86" cy="45" r="5" fill="#d7fbff" opacity=".55"/>
    <g stroke="#6cefff" stroke-width="3" stroke-linecap="round" opacity=".76">
      <path d="M72 115l19 19 28-34"/><path d="M150 103h190"/><path d="M150 125h130"/><path d="M150 147h168"/>
      <path d="M72 205h38l23-32 35 61 35-47 34 35 37-51 28 34h70"/>
      <path d="M72 270h75M72 290h110M72 310h55"/>
    </g>
    <g stroke="#9a7cff" stroke-width="3" stroke-linecap="round" opacity=".82">
      <path d="M405 112h105M405 134h145M405 156h78"/><path d="M388 214c35-55 82-55 112 0s72 55 105 0"/>
    </g>
    <g fill="#72efff"><circle cx="405" cy="214" r="5"/><circle cx="500" cy="214" r="5"/><circle cx="605" cy="214" r="5"/></g>
    <g transform="translate(445 252)" fill="none" stroke="#73efff" stroke-width="3" opacity=".8">
      <path d="M28 8h44l12 15v57H16V23z"/><path d="M25 8v18h50V8M30 48h40M30 62h30"/>
    </g>
    <path d="M110 410h425l60 62H50z" fill="url(#glass)" stroke="#73eaff" stroke-opacity=".7" stroke-width="2"/>
    <path d="M250 431h145l24 25H226z" fill="#80f2ff" opacity=".42"/>
    <path d="M44 383h555" stroke="#b8faff" stroke-opacity=".55" stroke-width="2"/>
  </g>
  <g transform="translate(650 170)" filter="url(#softGlow)">
