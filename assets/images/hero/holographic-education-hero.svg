    <circle cx="310" cy="295" r="205" fill="none" stroke="#926aff" stroke-opacity=".14" stroke-width="2" stroke-dasharray="36 15"/>
    <g stroke="#54eaff" stroke-opacity=".65" stroke-width="2" fill="none">
      <path d="M70 200L170 145L260 210L354 120L478 180L545 260L476 365L360 410L245 370L145 420L65 330Z"/>
      <path d="M170 145L245 370M260 210L360 410M354 120L360 410M478 180L476 365M145 420L245 370" opacity=".55"/>
    </g>
    <g fill="#73f6ff">
      <circle cx="70" cy="200" r="6"/><circle cx="170" cy="145" r="7"/><circle cx="260" cy="210" r="6"/><circle cx="354" cy="120" r="8"/><circle cx="478" cy="180" r="6"/><circle cx="545" cy="260" r="5"/><circle cx="476" cy="365" r="7"/><circle cx="360" cy="410" r="6"/><circle cx="245" cy="370" r="5"/><circle cx="145" cy="420" r="7"/>
    </g>
    <g fill="#a878ff"><circle cx="260" cy="210" r="3"/><circle cx="476" cy="365" r="3"/><circle cx="354" cy="120" r="3"/></g>
  </g>
  <g transform="translate(865 215)" filter="url(#glow)">
