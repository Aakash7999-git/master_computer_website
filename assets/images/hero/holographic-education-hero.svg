<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Holographic computer education technology interface</title>
  <desc id="desc">A transparent futuristic computer interface with code, network, cloud, database and security symbols arranged on the right side of a midnight blue scene.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#061329"/>
      <stop offset="0.55" stop-color="#0a1d3d"/>
      <stop offset="1" stop-color="#15265b"/>
    </linearGradient>
    <radialGradient id="halo" cx="72%" cy="45%" r="52%">
      <stop offset="0" stop-color="#35d7ff" stop-opacity=".25"/>
      <stop offset=".42" stop-color="#2377ff" stop-opacity=".12"/>
      <stop offset="1" stop-color="#101d52" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#bff7ff" stop-opacity=".2"/>
      <stop offset=".45" stop-color="#389cff" stop-opacity=".08"/>
      <stop offset="1" stop-color="#a26dff" stop-opacity=".18"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#0e3f73" stop-opacity=".8"/>
      <stop offset=".55" stop-color="#071d43" stop-opacity=".92"/>
      <stop offset="1" stop-color="#1b316c" stop-opacity=".9"/>
    </linearGradient>
    <linearGradient id="cyanLine" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#5cf4ff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#5cf4ff"/>
      <stop offset="1" stop-color="#b47cff" stop-opacity="0"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="28"/></filter>
    <filter id="glow"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="softGlow"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="circuit" width="90" height="90" patternUnits="userSpaceOnUse">
      <path d="M8 28h24V10h25M60 10v27h21M8 72h36V51h36" fill="none" stroke="#42cfff" stroke-opacity=".12" stroke-width="1.5"/>
      <circle cx="8" cy="28" r="3" fill="#6aefff" fill-opacity=".3"/><circle cx="81" cy="37" r="3" fill="#a87cff" fill-opacity=".25"/>
    </pattern>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#halo)"/>
  <ellipse cx="1130" cy="550" rx="420" ry="170" fill="#18b9ff" opacity=".13" filter="url(#blur)"/>
  <ellipse cx="1260" cy="280" rx="180" ry="120" fill="#a36dff" opacity=".1" filter="url(#blur)"/>
  <path d="M0 760H1600V900H0z" fill="url(#circuit)" opacity=".7"/>
  <g opacity=".65" fill="none" stroke="#54dfff" stroke-width="1">
    <path d="M0 120H400l65 65h180" opacity=".16"/><path d="M0 160H245l40 40h170" opacity=".1"/>
    <path d="M820 850h190l30-30h200l35-35h325" opacity=".35"/>
