    <path d="M20 42h95M20 62h69M20 82h88M20 115h30M62 115h53M20 135h70" stroke="#75efff" stroke-opacity=".7" stroke-width="3" stroke-linecap="round"/>
    <circle cx="104" cy="135" r="8" fill="#a77cff" opacity=".8"/>
  </g>
  <g transform="translate(1410 205)" filter="url(#softGlow)">
