  </g>
  <g transform="translate(147 145)" fill="none" stroke="#e1fdff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity=".9">
    <path d="M33 0v70M0 34h66"/><path d="M14 14l38 38M52 14L14 52" opacity=".55"/>
  </g>
  <path d="M70 292c73 30 151 25 220-8" fill="none" stroke="#65eaff" stroke-opacity=".35" stroke-width="2"/>
