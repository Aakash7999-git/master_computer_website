<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 360" role="img" aria-labelledby="title desc">
  <title id="title">Holographic digital learning orb</title>
  <desc id="desc">A glowing transparent technology orb with connected nodes and geometric learning symbols.</desc>
  <defs>
    <radialGradient id="core"><stop stop-color="#b9fbff" stop-opacity=".9"/><stop offset=".3" stop-color="#2ddcff" stop-opacity=".35"/><stop offset="1" stop-color="#2366ff" stop-opacity="0"/></radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#75f5ff"/><stop offset=".55" stop-color="#378dff"/><stop offset="1" stop-color="#ae78ff"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <circle cx="180" cy="180" r="150" fill="url(#core)" opacity=".35"/>
  <g fill="none" stroke="url(#ring)" filter="url(#glow)">
    <ellipse cx="180" cy="180" rx="126" ry="58" transform="rotate(-28 180 180)" stroke-width="3" opacity=".8"/>
